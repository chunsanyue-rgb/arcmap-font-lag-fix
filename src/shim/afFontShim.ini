[general]
; enabled=0 则完全恢复原生行为（纯透传），可用来快速对比
enabled=1
; dedupe_family=1 按"字体名"预去重后再回调（与 afUILib 自己的判重口径一致）
dedupe_family=1
; use_memory_dc=1 用内存 DC 枚举（实测 3087 项 0~16ms，远快于 ArcMap 传入的 DC）
; 若发现字体列表异常，可置 0 退回用调用方的 DC
use_memory_dc=1
; fast_combo=1 在回放期间让 CB_GETCOUNT 返回 0，跳过 afUILib 的 O(n^2) 逐条比对循环
; （Shim 已去重，最终列表条目数与原来完全相同；实测该项把 replay 从 328ms 降到 78ms）
; 若字体下拉列表出现异常，可置 0 关闭本项
fast_combo=1
; log=1 在 DLL 同目录生成 afFontShim.log
log=1
; charset 白名单：留空=不限制。若仍嫌慢，可填 1,2,134,136,255 只保留常用字符集
charset_whitelist=
